[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stratus-preprocessing"
version = "1.0.0"
description = "Regime-aware local operator selection for adaptive time-series preprocessing"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [
  {name = "Jennifer Landes", email = "jennifer.landes@informatik.uni-regensburg.de"},
  {name = "Meike Klettke", email = "meike.klettke@informatik.uni-regensburg.de"}
]
keywords = ["time series", "data cleaning", "HMM", "eye tracking", "preprocessing"]
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "scipy>=1.13,<2",
  "scikit-learn>=1.5,<2",
  "matplotlib>=3.9,<4"
]

[project.optional-dependencies]
notebook = ["jupyter>=1.1,<2", "nbformat>=5.10,<6", "nbconvert>=7.16,<8"]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
